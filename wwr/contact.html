<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting Company for reservations, general inquiries, or website suggestions. Reach us by phone, email, or through our online contact form.">
    <meta name="author" content="Your Name">
    <title>Contact Us | White Water Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="White Water Rafting Company Logo">
        </div>
        <nav>
            <a href="about.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="about.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Company Information Section -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <div class="contact-details">
                <p><strong>Address:</strong> 123 Main River Street, Kolob, California</p>
                <p><strong>Phone:</strong> +1 999 999 9999</p>
                <p><strong>Email:</strong> <a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
            </div>
        </section>

        <!-- Map and Form Section -->
        <section class="map-form-section">
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.1422937950147!2d-73.98731968482413!3d40.75889497932681!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25855c6480299%3A0x55194ec5a1ae072e!2sTimes%20Square!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus" 
                    width="100%" 
                    height="300" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade"
                    title="White Water Rafting Company Location Map">
                </iframe>
            </div>

            <div class="form-container">
                <h2>Send Us a Message</h2>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your email address" required>
                    </div>

                    <div class="form-group">
                        <label>Message Purpose</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="purpose" value="general" required>
                                General Inquiry
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="purpose" value="reservation">
                                Reservation Question
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="purpose" value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="newsletter" value="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </div>
        </section>

        <!-- Employee Profiles Section -->
        <section class="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="employees">
                <figure class="employee-card">
                    <img src="images/employee1.jpeg" alt="John Smith, Lead River Guide">
                    <figcaption>John Smith<br><span>Lead River Guide</span></figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee2.jpeg" alt="Sarah Johnson, Reservations Manager">
                    <figcaption>Sarah Johnson<br><span>Reservations Manager</span></figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee3.jpeg" alt="Mike Davis, Safety Coordinator">
                    <figcaption>Mike Davis<br><span>Safety Coordinator</span></figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting Company | Geraldkelly Gerald</p>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                <img src="images/facebook.png" alt="Facebook">
            </a>
            <a href="https://twitter.com" target="_blank" aria-label="Twitter">
                <img src="images/twitter.jpeg" alt="Twitter">
            </a>
            <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                <img src="images/instagram.png" alt="Instagram">
            </a>
        </div>
    </footer>
</body>
</html>
